[project]
name = "safeguard-ai-backend"
version = "0.1.0"
description = "Technical analysis engine for stock pattern detection and financial safeguards"
authors = [{name = "Safeguard AI Team"}]
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.11.1",
    "pydantic-settings>=2.0.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "redis>=5",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "asyncpg>=0.28",
    "python-dotenv>=1.0",
    "confluent-kafka>=2.0",
    "python-jose[cryptography]>=3.3",
    "requests>=2.31",
    "deep-translator>=1.11.4",
    "yfinance>=0.2.0",
    "pybreaker>=1.1.0",
    "curl-cffi>=0.7.0",
    "transformers>=4.40.0,<5.0.0",
    "torch>=2.2.0",
]
requires-python = ">=3.11,<3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]
