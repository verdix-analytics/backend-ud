services:
  api:
    build: .
    container_name: safeguard-ai-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SCHEDULER_ENABLED=false
      - SCHEDULER_INTERVAL_MINUTES=5
      - SCHEDULER_USE_SAMPLE_DATA=false
      - SCHEDULER_INSTRUMENTS=AAPL,MSFT,BTCUSD
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/safeguard-ai
      - KAFKA_ENABLED=true
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_AUTO_OFFSET_RESET=latest
      - KAFKA_TOPIC_1H=financial-1h
      - KAFKA_TOPIC_1M=financial-1m
      - KAFKA_TOPIC_1Y=financial-1y
      - KAFKA_TOPIC_CANDLESTICK=candlestick
      - KAFKA_TOPIC_CHART=chart
      - KAFKA_TOPIC_HARMONIC=harmonic
      - KAFKA_TOPIC_RUN_EXTERNAL_STOCK_ANALYSIS=run-external-stock-analysis
      - KAFKA_GROUP_ID_1H=safeguard-consumer-1h
      - KAFKA_GROUP_ID_1M=safeguard-consumer-1m
      - KAFKA_GROUP_ID_1Y=safeguard-consumer-1y
      - KAFKA_GROUP_ID_CANDLESTICK=safeguard-pattern-consumer-candlestick
      - KAFKA_GROUP_ID_CHART=safeguard-pattern-consumer-chart
      - KAFKA_GROUP_ID_HARMONIC=safeguard-pattern-consumer-harmonic
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    container_name: safeguard-ai-redis
    ports:
      - "6379:6379"

  postgres:
    image: timescale/timescaledb:latest-pg18
    container_name: safeguard-ai-postgres
    environment:
      POSTGRES_DB: safeguard-ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: safeguard-ai-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 24
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: MkU3OEVCNTcwNTJENDM2Qg
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: safeguard-ai-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        echo "Waiting for Kafka broker..."
        until kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
          sleep 3
        done

        echo "Creating required Kafka topics..."
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic financial-1h --partitions 24 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic financial-1m --partitions 24 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic financial-1y --partitions 24 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic candlestick --partitions 24 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic chart --partitions 24 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic harmonic --partitions 24 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic run-external-stock-analysis --partitions 24 --replication-factor 1

        echo "Kafka topics are ready."

volumes:
  postgres_data:
  kafka-data:
